services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rallyos-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rallyos-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
